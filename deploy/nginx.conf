# Para un VPS que ya usa nginx (por ejemplo, compartido con otro proyecto).
# /etc/nginx/sites-available/wildwood-registry  →  enlazar en sites-enabled
# Certificado: sudo certbot --nginx -d registry.wildwood-training.com
server {
    listen 80;
    server_name registry.wildwood-training.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name registry.wildwood-training.com;

    ssl_certificate     /etc/letsencrypt/live/registry.wildwood-training.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registry.wildwood-training.com/privkey.pem;

    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
