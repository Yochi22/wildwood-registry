# Ajuste para VPS tipo contenedor (LXC/OpenVZ), donde systemd no puede aislar
# el sistema de archivos. Se instala junto al servicio:
#   sudo mkdir -p /etc/systemd/system/wildwood-registry.service.d
#   sudo cp deploy/lxc.conf /etc/systemd/system/wildwood-registry.service.d/lxc.conf
[Service]
PrivateTmp=false
ProtectSystem=false
ProtectHome=false
ReadWritePaths=
